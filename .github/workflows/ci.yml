name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The harness-neutral engine and its PiG adapter are separate modules.
        module: [memory, extensions/observational-memory]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The runner's Go honours GOTOOLCHAIN=auto and fetches the version go.mod
      # names, so no setup action is needed.
      - run: go version
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The sandbox's build-tagged platform files must compile everywhere.
      - run: GOOS=darwin go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -race ./...
