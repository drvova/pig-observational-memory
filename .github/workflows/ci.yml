name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/observational-memory
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The runner's Go honours GOTOOLCHAIN=auto and fetches the version go.mod
      # names, so no setup action is needed.
      - run: go version
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # The LongMemEval harness is a nested module (see docs/bench.md).
      - run: go vet ./...
        working-directory: extensions/observational-memory/cmd/longmemeval
